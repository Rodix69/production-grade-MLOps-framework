name: mlops-automation
prefect-version: 2.14.21

deployments:
  - name: default
    version: 1
    tags:
      - churn
      - automation
    schedule:
      cron: "0 6 * * *"
      timezone: "UTC"
    flow_name: churn-pipeline
    entrypoint: main_flow.py:main_flow
    work_pool:
      name: default-agent-pool