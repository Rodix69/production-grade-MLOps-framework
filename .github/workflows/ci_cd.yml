name: Churn API - CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. Test
  test:
    name: Run API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install fastapi uvicorn pandas mlflow scikit-learn numpy pydantic pytest httpx

      - name: Run tests
        run: |
          cd deployment
          pytest tests/test_api.py -v

  # 2. Build and Push Docker image
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./deployment
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/telecom-churn-api:latest
            ${{ secrets.DOCKER_USERNAME }}/telecom-churn-api:${{ github.sha }}